<template>
    <div style="height:0px">
        <c-qb_-custom-toast-comp></c-qb_-custom-toast-comp>
    </div>
    <div class="slds-is-absolute">
        <!--     <c-qb_-custom-toast-comp></c-qb_-custom-toast-comp>
   -->
    </div>
    <div class="buttonDivSection slds-align_absolute-center">
        <lightning-input class="slds-text-align_center slds-form-element tog" style="color:#1fec04" type="toggle" label="Switch To Default Mappings?"
            message-toggle-inactive="No"
            message-toggle-active="Yes"
            onchange={handlechangeToggle}
            checked={togChecked}>
        </lightning-input>
    </div>
    <div class="slds-card slds-card_boundary">
        <table
            class="slds-table slds-wrap slds-table--bordered slds-table--cell-buffer slds-table--cell-buffer slds-max-medium-table--stacked-horizontal">
            <thead>
                <tr class="contractRowCls">
                    <th scope="col" style="width: 20px; padding:0px" class="HeadingCss"></th>
                    <th scope="col" class="HeadingCss">
                        <div class="slds-truncate" title="Quickbook Company"><b>{QuickbookCompanyTxt}</b></div>
                    </th>
                    <th scope="col" class="HeadingCss">
                      <div class="slds-truncate" title="Quickbook Object"><b>{QuickBookObjLabel}</b></div>
                  </th>
                    <th scope="col" class="HeadingCss">
                        <div class="slds-truncate" title="Salesforce Object"><b>{SalesforceObjLabel}</b></div>
                    </th>
                    
                    <th scope="col" style="width: 120px;" class="HeadingCss">
                        <div class="slds-truncate slds-float_right" title="Field Mapping"><b>{FieldMappingTxt}</b></div>
                    </th>
                    <th scope="col" style="width: 75px;" class="HeadingCss">
                        <div class="slds-truncate slds-float_right" title="Action"><b>{ActionTxt}</b></div>
                    </th>
                </tr>
            </thead>
            <tbody>
  
                <template if:false={isSfqbConfigNotEmpty}>
                    <tr>
                        <td colspan=6 style="text-align:center"><label
                                class="slds-form-element__label">{loadingMessage}</label></td>
                    </tr>
                </template>
                <template if:true={isSfqbConfigNotEmpty}>
                    <template for:each={QbToSfConfigDataList} for:item="objLevRec" for:index="objindex">
                        <tr key={objLevRec.Name} data-objconfigid={objLevRec.Name} data-objindex={objindex}
                            class="validate-tablerow" >
  
                            <td style="width: 20px; padding:0px" class={vfpageErrorIconCss}>
                                <lightning-icon style="display: none;" class="validation-error"
                                    icon-name="utility:warning" 
                                    alternative-text="Warning!" variant="error" size="x-small"></lightning-icon>
                            </td>
                            <td data-label="Quickbook Company">
  
                                <c-qb_-auto-complete-dropdown-custom name="hic_qbmadeasy__Company_ID__c"
                                    class="validation-check-class auto-complete-dropdown-class sf-entity-Name"
                                    options={companyOptions} data-fieldapiname="CompanyName__c"
                                    placeholder="Select Company" value={objLevRec.hic_qbmadeasy__Company_ID__c}
                                    onchange={setUpdatedValuetoObjConfigRecord} data-index={objindex}></c-qb_-auto-complete-dropdown-custom>
                            </td>
  
                            <td data-label="Quickbook Entity">
  
                              <c-qb_-auto-complete-dropdown-custom name="hic_qbmadeasy__QB_Entity__c"
                                  class="validation-check-class auto-complete-dropdown-class"
                                  options={QbObjectTypeOptionsList} data-fieldapiname="IntegrationReferenceId__c"
                                  placeholder="Select QB Object Type" value={objLevRec.hic_qbmadeasy__QB_Entity__c}
                                  data-index={objindex} onchange={setUpdatedValuetoObjConfigRecord}>
                              </c-qb_-auto-complete-dropdown-custom>
                            </td>
                            
                            <td data-label="Salesforce Entity">
  
                                <c-qb_-auto-complete-dropdown-custom name="hic_qbmadeasy__SF_Entity__c"
                                    class="validation-check-class auto-complete-dropdown-class sf-entity-Name"
                                    options={sObjectOptions} data-fieldapiname="SobjectName__c"
                                    placeholder="Select Sobject" value={objLevRec.hic_qbmadeasy__SF_Entity__c}
                                    onchange={setUpdatedValuetoObjConfigRecord}></c-qb_-auto-complete-dropdown-custom>
                            </td>
                            
                            <!-- <td data-label="QBOperation">
  
                                <c-qb_-auto-complete-dropdown-custom name="hic_qbmadeasy__QB_Operation__c"
                                    class="validation-check-class auto-complete-dropdown-class"
                                    options={QBOperationOptionsList} data-fieldapiname="OperationName__c"
                                    placeholder="QB Operation" value={objLevRec.hic_qbmadeasy__QB_Operation__c}
                                    onchange={setUpdatedValuetoObjConfigRecord}></c-qb_-auto-complete-dropdown-custom>
                            </td> -->
                            <!-- <td data-label="QBReferenceField">
  
                                <c-qb_-auto-complete-dropdown-custom name="hic_qbmadeasy__QB_Reference_Field__c"
                                    class="validation-check-class auto-complete-dropdown-class"
                                    options={QBReferenceFieldOptionsList} data-fieldapiname="ReferenceField__c"
                                    placeholder="QB Reference Field"
                                    value={objLevRec.hic_qbmadeasy__QB_Reference_Field__c}
                                    disabled={objLevRec.qbReferenceFieldDisabled}
                                    onchange={setUpdatedValuetoObjConfigRecord}></c-qb_-auto-complete-dropdown-custom>
                            </td> -->
                            <td data-label="Expand Configuration">
                                <div class="slds-align_absolute-center">
                                    <div if:true={objLevRec.showSpinner} class="loader"
                                        style="position:absolute;margin-left:2.8rem;width:14px;height:14px"></div>
                                    <div onclick={expandCollapseFunction} data-index={objindex}
                                        data-configid={objLevRec.Id} data-switchto="expand" title="Click to Expand"
                                        class="expand-collapse-container" >
                                        <lightning-icon icon-name="utility:add" class="add-collapse-icon" alternative-text="Utility Settings"
                                            size="x-small"></lightning-icon>
                                            
                                            <!-- <lightning-icon icon-name="utility:dash" class="close-expand-container" alternative-text="Utility Settings"
                                            size="x-small"></lightning-icon>  -->
                                    </div>
                                </div>
                            </td>
                            <td data-label="Action">
                                <div class="slds-media__body slds-float_right" data-objconfigid={objLevRec.Name}>
                                    <lightning-button-menu alternative-text="Show menu" icon-size="small"
                                        menu-alignment="right">
                                        <!-- <lightning-menu-item value="Clone" label="Clone"
                                            onclick={cloneSfToqbObjectConfigRecord}></lightning-menu-item> -->
                                        <lightning-menu-item value="Delete" label="Delete"
                                            onclick={deleteSfToqbObjectConfigRecord}></lightning-menu-item>
  
                                    </lightning-button-menu>
                                </div>
                            </td>
                        </tr>
                        <tr key={objLevRec.Name} data-objconfigid={objLevRec.Name} class="collapse-row" >
                            <td colspan=6>
                                <div class="FieldMappingTableClass">
                                    <div class="slds-card slds-card_boundary">
                                        <table
                                            class="slds-table slds-wrap slds-table--bordered slds-table--cell-buffer slds-table--cell-buffer slds-max-medium-table--stacked-horizontal">
                                            <thead>
                                                <tr class="contractRowCls">
                                                    <th scope="col" class="fieldHeadingCss">
                                                        <div class="slds-truncate" title="Data Mapping Type"><b>{DataMappingTxt}</b></div>
                                                    </th>
                                                    <th scope="col" class="fieldHeadingCss">
                                                        <div class="slds-truncate " title="Salesforce Field"><b>{SFFieldTxt}</b></div>
                                                    </th>
                                                    <th scope="col" class="fieldHeadingCss">
                                                        <div class="slds-truncate" title="Constant"><b>{ConstantTxt}</b>
                                                        </div>
                                                    </th>
                                                    <th scope="col" class="fieldHeadingCss">
                                                        <div class="slds-truncate " title="Quickbook Field"><b>{QuickBookTxt}</b>
                                                        </div>
                                                    </th>
  
                                                    <th scope="col" style="width: 250px;" class="fieldHeadingCss">
                                                        <div class="slds-truncate" title="Related Field">
                                                            <b>{RelatedFieldTxt}</b>
                                                        </div>
                                                    </th>
                                                    <th scope="col" style="width: 50px;" class="fieldHeadingCss">
                                                        <div class="slds-truncate" title="Add Related Mappings"><b></b>
                                                        </div>
                                                    </th>
                                                    <th scope="col" style="width: 75px;" class="fieldHeadingCss">
                                                        <div class="slds-truncate slds-float_right"
                                                            title="Action"><b>{ActionTxt}</b></div>
                                                    </th>
  
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={objLevRec.fieldsJson} for:item="fieldRec"
                                                    for:index="fldindex">
                                                    <tr key={fieldRec.Name} data-objconfigid={objLevRec.Name}
                                                        data-fldconfigid={fieldRec.Name} class="validate-field-row">
                                                        <td data-label="mappingType">
                                                            <lightning-combobox
                                                                name="hic_qbmadeasy__Data_Mapping_Type__c" label=""
                                                                value={fieldRec.hic_qbmadeasy__Data_Mapping_Type__c}
                                                                placeholder="Select Mapping Type"
                                                                options={MappingTypeOptions} variant="label-hidden"
                                                                onchange={setUpdatedValuetoFieldRecObj}>
                                                            </lightning-combobox>
                                                        </td>
                                                        <td data-label="sf_fieldName" data-id="sf_fieldName" class="validation-sf-field">
                                                          <template
                                                              if:false={fieldRec.hic_qbmadeasy__isRelatedMap__c}>
                                                              
                                                                  <lightning-input name="hic_qbmadeasy__SF_Field__c"
                                                                      variant="label-hidden" label="" type="text"
                                                                      class="validation-check-for-sf-field"
                                                                      data-sobjectname={objLevRec.hic_qbmadeasy__SF_Entity__c}
                                                                      data-parentobjectname={fieldRec.hic_qbmadeasy__SF_Parent_Object__c}
                                                                      data-parentobject2name={fieldRec.hic_qbmadeasy__SF_Parent_Object2__c}
                                                                      value={fieldRec.hic_qbmadeasy__SF_Field_Label__c}
                                                                      onclick={openSfFieldSelectionPopup}>
                                                                  </lightning-input>
                                                              
                                                              <!-- <template if:true={fieldRec.hic_qbmadeasy__Constant__c}>
                                                                  <lightning-input type="text" class="validation-check-for-sf-field" 
                                                                      name="hic_qbmadeasy__SF_Field__c" pattern="^\S.*\S$" message-when-pattern-mismatch="First character must be an underscore or alphabet/number"
                                                                      variant="label-hidden"
                                                                      value={fieldRec.hic_qbmadeasy__SF_Field__c}
                                                                      onchange={setUpdatedValuetoFieldRecObj}>
                                                                  </lightning-input>
                                                              </template> -->
                                                          </template>
                                                          <template if:true={fieldRec.hic_qbmadeasy__isRelatedMap__c}>
  
  
                                                              <c-qb_-auto-complete-dropdown-custom
                                                                  name="hic_qbmadeasy__SFChildRelationshipName__c"
                                                                  class="auto-complete-dropdown-class validation-check-for-sf-field"
                                                                  options={objLevRec.childSobjList}
                                                                  placeholder="Select SF Field"
                                                                  value={fieldRec.hic_qbmadeasy__SFChildRelationshipName__c}
                                                                  onchange={setUpdatedValuetoFieldRecObj}>
                                                              </c-qb_-auto-complete-dropdown-custom>
                                                          </template>
                                                        </td>
                                                        
                                                        <td data-label="isConstant" title="Constant">
                                                            <template
                                                                if:false={fieldRec.hic_qbmadeasy__isRelatedMap__c}>
  
                                                                <template if:true={fieldRec.hic_qbmadeasy__Constant__c}>
                                                                    <lightning-input type="checkbox"
                                                                        variant="label-hidden"
                                                                        name="hic_qbmadeasy__Constant__c" label=""
                                                                        onchange={setUpdatedValuetoFieldRecObj} checked>
                                                                    </lightning-input>
                                                                </template>
                                                                <template
                                                                    if:false={fieldRec.hic_qbmadeasy__Constant__c}>
                                                                    <lightning-input type="checkbox"
                                                                        variant="label-hidden"
                                                                        name="hic_qbmadeasy__Constant__c" label=""
                                                                        onchange={setUpdatedValuetoFieldRecObj}>
                                                                    </lightning-input>
                                                                </template>
                                                            </template>
                                                            <template if:true={fieldRec.hic_qbmadeasy__isRelatedMap__c}>
                                                                <template if:true={fieldRec.hic_qbmadeasy__Constant__c}>
                                                                    <lightning-input type="checkbox"
                                                                        variant="label-hidden"
                                                                        name="hic_qbmadeasy__Constant__c" label=""
                                                                        checked disabled></lightning-input>
                                                                </template>
                                                                <template
                                                                    if:false={fieldRec.hic_qbmadeasy__Constant__c}>
                                                                    <lightning-input type="checkbox"
                                                                        variant="label-hidden"
                                                                        name="hic_qbmadeasy__Constant__c" label=""
                                                                        disabled></lightning-input>
                                                                </template>
                                                            </template>
                                                        </td>
                                                        <td data-label="qb_fieldName" data-id="qb_fieldName">
                                                          <template
                                                              if:false={fieldRec.hic_qbmadeasy__isRelatedMap__c}>
  
                                                              <template if:false={fieldRec.hic_qbmadeasy__Constant__c}>
                                                                <c-qb_-auto-complete-dropdown-custom name="hic_qbmadeasy__Quickbook_Field__c" class="auto-complete-dropdown-class validation-check-for-sf-field" options={objLevRec.qbtypeFieldsList} data-contracttype={objLevRec.hic_qbmadeasy__QB_Entity__c} placeholder="Select QB Field" value={fieldRec.hic_qbmadeasy__Quickbook_Field__c} onchange={setUpdatedValuetoFieldRecObj}></c-qb_-auto-complete-dropdown-custom>
                                                              </template>
                                                              <template if:true={fieldRec.hic_qbmadeasy__Constant__c}>
                                                                  <template if:true={fieldRec.isDate}>
                                                                      <lightning-input type="date" name="hic_qbmadeasy__Quickbook_Field__c" variant="label-hidden" value={fieldRec.hic_qbmadeasy__Quickbook_Field__c} onchange={setUpdatedValuetoFieldRecObj} class = "validation-check-for-sf-field"></lightning-input>
                                                                  </template>
  
                                                                  <template if:true={fieldRec.isTime}>
                                                                      <lightning-input type="time" name="hic_qbmadeasy__Quickbook_Field__c" variant="label-hidden" value={fieldRec.hic_qbmadeasy__Quickbook_Field__c} onchange={setUpdatedValuetoFieldRecObj} class = "validation-check-for-sf-field"></lightning-input>
                                                                  </template>
  
                                                                  <template if:true={fieldRec.isDateTime}>
                                                                      <lightning-input type="datetime" name="hic_qbmadeasy__Quickbook_Field__c" variant="label-hidden" value={fieldRec.hic_qbmadeasy__Quickbook_Field__c} onchange={setUpdatedValuetoFieldRecObj} class = "validation-check-for-sf-field"></lightning-input>
                                                                  </template>
  
                                                                  <!-- <template if:true={fieldRec.hic_qbmadeasy__isText__c}>
                                                                      <lightning-input type="text" name="hic_qbmadeasy__Quickbook_Field__c" variant="label-hidden" value={fieldRec.hic_qbmadeasy__Quickbook_Field__c} onchange={setUpdatedValuetoFieldRecObj} class = "validation-check-for-sf-field"></lightning-input>
                                                                  </template> -->
  
                                                                  <template if:false={fieldRec.isDate}>
                                                                      <template if:false={fieldRec.isDateTime}>
                                                                          <template if:false={fieldRec.isTime}>
                                                                              <lightning-input type="text" name="hic_qbmadeasy__Quickbook_Field__c" variant="label-hidden" value={fieldRec.hic_qbmadeasy__Quickbook_Field__c} onchange={setUpdatedValuetoFieldRecObj} class = "validation-check-for-sf-field"></lightning-input>
                                                                          </template>
                                                                      </template>
                                                                  </template>
                                                                  
                                                                  <!-- <lightning-input type="text" name="hic_qbmadeasy__Quickbook_Field__c" variant="label-hidden" value={fieldRec.hic_qbmadeasy__Quickbook_Field__c} onchange={setUpdatedValuetoFieldRecObj} class = "validation-check-for-sf-field"></lightning-input> -->
                                                              </template>
                                                          </template>
                                                          <template if:true={fieldRec.hic_qbmadeasy__isRelatedMap__c}>
  
                                                              <!-- <c-qb_-auto-complete-dropdown-custom
                                                                  name="hic_qbmadeasy__Quickbook_Field__c"
                                                                  class="auto-complete-dropdown-class validation-check-for-sf-field"
                                                                  options={objLevRec.qbtypeTableList}
                                                                  data-contracttype={objLevRec.hic_qbmadeasy__QB_Entity__c}
                                                                  placeholder="Select QB Field"
                                                                  value={fieldRec.hic_qbmadeasy__Quickbook_Field__c}
                                                                  onchange={setUpdatedValuetoFieldRecObj}>
                                                              </c-qb_-auto-complete-dropdown-custom> -->
                                                              <c-qb_-auto-complete-dropdown-custom name="hic_qbmadeasy__Quickbook_Field__c" class="auto-complete-dropdown-class validation-check-for-sf-field" options={objLevRec.qbtypeTableList} data-contracttype={objLevRec.hic_qbmadeasy__QB_Entity__c} placeholder="Select QB Field" value={fieldRec.hic_qbmadeasy__Quickbook_Field__c} onchange={setUpdatedValuetoFieldRecObj}></c-qb_-auto-complete-dropdown-custom>
                                                          </template>
                                                      </td>
                                                        
  
                                                        <td data-label="Related List Fields">
                                                            <template
                                                                if:false={fieldRec.hic_qbmadeasy__isRelatedMap__c}>
                                                                <lightning-pill-container
                                                                    items={fieldRec.hic_qbmadeasy__RelatedDataValues__c}
                                                                    onitemremove={removeRelMappingsFromContainerList}
                                                                    style="background-color: rgb(233, 234, 236)">
                                                                </lightning-pill-container>
                                                            </template>
                                                            <template if:true={fieldRec.hic_qbmadeasy__isRelatedMap__c}>
  
                                                                <lightning-pill-container
                                                                    items={fieldRec.hic_qbmadeasy__RelatedDataValues__c}
                                                                    onitemremove={removeRelMappingsFromContainerList}>
                                                                </lightning-pill-container>
                                                            </template>
                                                        </td>
                                                        <td data-label="Add Related Fields">
                                                            <lightning-button variant="base"
                                                                if:true={fieldRec.hic_qbmadeasy__isRelatedMap__c}
                                                                data-sffieldname={fieldRec.hic_qbmadeasy__SF_Field__c}
                                                                data-cpfieldname={fieldRec.hic_qbmadeasy__Quickbook_Field__c}
                                                                label="Add" onclick={openRelfldMappingPopup}
                                                                class="slds-m-left_x-small"></lightning-button>
                                                        </td>
                                                        <td data-label="Action">
                                                            <div class="slds-media__body slds-float_right"
                                                                data-objconfigid={objLevRec.Name}
                                                                data-fldconfigid={fieldRec.Name}>
                                                                <lightning-button-menu alternative-text="Show menu"
                                                                    icon-size="small" menu-alignment="right">
                                                                    <lightning-menu-item value="Clone" label="Clone"
                                                                        onclick={cloneSfToqbFieldConfigRecord}>
                                                                    </lightning-menu-item>
                                                                    <lightning-menu-item value="Delete" label="Delete"
                                                                        onclick={deleteSfToqbFieldConfigRecord}>
                                                                    </lightning-menu-item>
                                                                </lightning-button-menu>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                        <div class="addFieldMappingLinkClass slds-form-element__label"
                                            data-objconfigid={objLevRec.Name}>
                                            <lightning-button variant="base" label="Add Field"
                                                onclick={addSFToqbFieldMappingRow}></lightning-button>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </template>
                </template>
            </tbody>
        </table>
    </div>
  
    <div class="addObjConfigLinkClass slds-form-element__label">
        <lightning-button variant="base" label="Add" onclick={addSFToqbConfigRow}></lightning-button>
    </div>
    <template if:true={inProgress}>
        <div class="">
            <lightning-spinner variant="brand" size="small" class="custom-spinner"></lightning-spinner>
        </div>
    </template>
    <div class="slds-m-top_medium slds-m-bottom_x-large slds-align_absolute-center ">
        <span style="margin-left: 10px;">
            <div if:true={inProgress} style="position:relative;display:inline-block">{PleaseWaitTxt}</div>
        </span>
        <div class="buttonDivSection">
            <lightning-button disabled={inProgress} variant="brand" label="Save All" title="Save Configuration"
                onclick={saveAllSfToqbConfigData} class="slds-m-left_x-small"></lightning-button>
        </div>
    </div>
  
    <template if:true={displayPopup}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeInsertFieldPopup}>
                        <lightning-icon icon-name="utility:close" variant="inverse" alternative-text="Close"
                            size="medium">
                        </lightning-icon>
                        <span class="slds-assistive-text">{CloseTxt}</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">{InsertTxt}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" style="min-height: 350px;">
                    <div style="height:0px">
                        <c-qb_-custom-toast-comp></c-qb_-custom-toast-comp>
                    </div>
                    <lightning-layout>
                        <lightning-layout-item padding="around-small">
  
                            <c-qb_-auto-complete-dropdown-custom name="sffieldName" options={sobjectFieldList} data-objconfigidcustom={relObjConfigId} data-fldconfigidcustom={relFldConfigId} 
                                data-type="primary" class="auto-complete-dropdown-class displayPopup-sf-field-error" placeholder="Select SF Field"
                                value={sfFieldsSelObj.sffieldName} onchange={setUpdatedValuetoSfFieldRec}>
                            </c-qb_-auto-complete-dropdown-custom>
                        </lightning-layout-item>
                        <template if:true={sfFieldsSelObj.isReferenceMapping}>
  
                            <template if:true={isSFReferenceObjNotNull}>
                                <lightning-layout-item padding="around-small">
                                    <c-qb_-auto-complete-dropdown-custom name="sfparentFieldName" data-objconfigidcustom={relObjConfigId} data-fldconfigidcustom={relFldConfigId} 
                                        options={RefrenceFieldList} data-type="secondary"
                                        class="auto-complete-dropdown-class displayPopup-sf-field-error" placeholder="Select SF Field"
                                        value={sfFieldsSelObj.sfparentFieldName} onchange={setUpdatedValuetoSfFieldRec}>
                                    </c-qb_-auto-complete-dropdown-custom>
                                </lightning-layout-item>
                            </template>
  
                            <template if:true={isSFReferenceObj2NotNull}>
                                <lightning-layout-item padding="around-small">
                                    <c-qb_-auto-complete-dropdown-custom name="sfparentField2Name"
                                        options={RefrenceField2List} data-type="tertiary" data-objconfigidcustom={relObjConfigId} data-fldconfigidcustom={relFldConfigId} 
                                        class="auto-complete-dropdown-class displayPopup-sf-field-error" placeholder="Select SF Field"
                                        value={sfFieldsSelObj.sfparentField2Name}
                                        onchange={setUpdatedValuetoSfFieldRec}></c-qb_-auto-complete-dropdown-custom>
                                </lightning-layout-item>
                            </template>
  
                        </template>
                    </lightning-layout>
                </div>
                <footer class="slds-modal__footer" data-objconfigid={relObjConfigId} data-fldconfigid={relFldConfigId}>
                    <span style="margin-left: 10px;">
                        <lightning-button label="Save" variant="brand" onclick={saveSfFieldNameValue}>
                        </lightning-button>
                    </span>
                    <span style="margin-left: 10px;">
                        <lightning-button label="Cancel" variant="neutral" onclick={closeInsertFieldPopup}>
                        </lightning-button>
                    </span>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  
    <template if:true={reldatadisplayPopup}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container ">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeInsertFieldPopup}>
                        <lightning-icon icon-name="utility:close" variant="inverse" alternative-text="Close"
                            size="medium">
                        </lightning-icon>
                        <span class="slds-assistive-text">{CloseTxt}</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">{RelatedTxt}</h2>
                </header>
  
                <div class="slds-modal__content slds-var-p-around_medium" style="min-height: 350px;">
                    <div class="slds-text-align_center">
  
                        <c-qb_-qb-to-sf-rel-fields-mapping-comp related-data-list={RelFieldsMappingList}
                            sf-child-object-name={sfChildObjName} cp-child-object-fields={cpChildObjFields}
                            onrelmappingconfigchange={setUpdatedRelMappings} ></c-qb_-qb-to-sf-rel-fields-mapping-comp>
  
                    </div>
                </div>
                <footer class="slds-modal__footer" data-objconfigid={relObjConfigId} data-fldconfigid={relFldConfigId}>
                    <span style="margin-left: 10px;">
                        <lightning-button label="Save" variant="brand" onclick={saveRelDataMappings}>
                        </lightning-button>
                    </span>
                    <span style="margin-left: 10px;">
                        <lightning-button label="Cancel" variant="neutral" onclick={closeInsertFieldPopup}>
                        </lightning-button>
                    </span>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  
  
  
  </template>
