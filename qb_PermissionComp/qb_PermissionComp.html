<template>
    <div if:false={isLoaded} class="slds-align_absolute-center">
      <lightning-spinner variant="brand" size="small" alternative-text="Loading">
      </lightning-spinner>
    </div>
    <article class="slds-card" style="border: none;
    padding: 0.25rem;
    background-color: rgba(241,241,241,.5);box-shadow: 0px 2px 2px #6666;">
      <div class="slds-card__header slds-grid">
        <header class="slds-media slds-media_center slds-has-flexi-truncate">
          <div class="slds-media__figure">
            <span class="slds-icon_container slds-icon-standard-account" title="Setup">
              <lightning-icon icon-name="standard:user" size="medium">
              </lightning-icon>
            </span>
          </div>
          <div class="slds-media__body">
            <h2 class="slds-card__header-title" style="font-weight: 500;">
              QB Made Easy Permissions
            </h2>
          </div>
        </header>
      </div>
    </article>
    <div class="main-class" style="margin-left: 0.5rem;
    margin-top: 1rem;">
      <div class="slds-tabs_default">
        <ul class="slds-tabs_default__nav" role="tablist">
          <li class="slds-tabs_default__item slds-is-active" title="Overview" role="presentation"
          onclick={handleTab}>
            <a class="slds-tabs_default__link" href="#" role="tab" tabindex="0" aria-selected="true"
            aria-controls="tab-default-1" id="tab-default-1__item">
              Overview
            </a>
          </li>
          <li class="slds-tabs_default__item" title="Admin" role="presentation"
          onclick={handleTab}>
            <a class="slds-tabs_default__link" href="#" role="tab" tabindex="-1" aria-selected="false"
            aria-controls="tab-default-2" id="tab-default-2__item">
              Admin
            </a>
          </li>
          <li class="slds-tabs_default__item" title="Business" role="presentation"
          onclick={handleTab}>
            <a class="slds-tabs_default__link" href="#" role="tab" tabindex="-1" aria-selected="false"
            aria-controls="tab-default-3" id="tab-default-3__item">
              Business
            </a>
          </li>
          <li class="slds-tabs_default__item" title="Read-Only" role="presentation"
          onclick={handleTab}>
            <a class="slds-tabs_default__link" href="#" role="tab" tabindex="-1" aria-selected="false"
            aria-controls="tab-default-4" id="tab-default-4__item">
              Read-Only
            </a>
          </li>

          onclick={handleTab}>

            aria-controls="tab-default-5" id="tab-default-5__item">
              All Permission Sets
            </a>
          </li>
        </ul>
        <div id="tab-default-1" class="slds-tabs_default__content slds-show" role="tabpanel"
        aria-labelledby="tab-default-1__item" style="color:black">
          <div class="content">
            <ul style="list-style-type: circle;margin-left:1.1rem;line-height:1.5rem">
              <li>
                <b>
                  QB Made Easy Admin Permission Set: 
                </b>
                &nbsp;Users with this permission set have full control over QB Made Easy functionality,
                including managing connections to QuickBooks entities, configuring settings,
                and accessing administrative tabs such as QB Setup and QB Mapping.
              </li>
              <li>
                <b>
                  QB Made Easy Business Permission Set: 
                </b>
                &nbsp;Users with this permission set, or higher, can utilize real-time synchronization
                features for QB Made Easy, ensuring timely and accurate data updates between
                Salesforce and QuickBooks.
              </li>
              <li>
                <b>
                  QB Made Easy Read-Only Permission Set: 
                </b>
                &nbsp;Users granted this permission set, or a higher one, are limited to viewing
                records within QB Made Easy, ensuring data integrity and security while
                still allowing access to vital information for reporting and analysis purposes.
              </li>
            </ul>
          </div>
        </div>
        <div id="tab-default-2" class="slds-tabs_default__content slds-hide" role="tabpanel"
        aria-labelledby="tab-default-2__item" style="display: flex;
        align-items: flex-start;
        gap: 1.5rem;
        flex-direction: column;
        color: black;

            The following users have the QB Sync Made Easy
            <b>
              &nbsp;Admin Permission Set 
            </b>
            .This allows to see the QB Setup,QB Mapping Tabs of QB Sync. Additionally,
            users with the QB Sync Made Easy Admin Permission Set are the only ones
            who can-
          </p>

            <li>
              Add/Delete QB Company
            </li>
            <li>
              Choose Price Book
            </li>
            <li>
              Bypass Duplicate Records
            </li>
            <li>
              Historical Sync , Realtime Sync
            </li>
            <li>

            </li>
            <li>

            </li>
