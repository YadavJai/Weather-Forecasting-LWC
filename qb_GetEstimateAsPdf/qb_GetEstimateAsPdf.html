<template>
    
    <!-- <lightning-button label={buttonLabel} variant="brand" title={buttonLabel} onclick={showModalBox} class="slds-m-left_x-small"></lightning-button> -->
    <button class="slds-button slds-button_outline-brand slds-p-horizontal_x-small" onclick={showModalBox}>
        <img src = {qbIcon} class="qbicon">
        {qbButtonLabel}
    </button>

    <template if:true={isShowModal}>
        
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
          
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={hideModalBox}>
                <lightning-icon icon-name="utility:close" variant="inverse" alternative-text="Close"
                size="medium">
            </lightning-icon>
            <span class="slds-assistive-text">Cancel and close</span>
            </button>
            <div class="slds-modal__header">
            <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Send Email and PDF to:</h1>
            </div>
            <div class="slds-modal__content modalBodySpinner slds-var-p-around_medium" id="modal-content-id-1" style="padding-bottom: 10%;" >
                <div if:false={isLoaded} class="slds-align_absolute-center">
                    <lightning-spinner variant="brand" size="small" alternative-text="Loading"></lightning-spinner>
                </div>
                <div if:true={isLoaded}>
                    <lightning-input value ={specificEmail} name="email" class="validate" type="email" label="Enter email address" pattern="[A-Za-z0-9._-]+@[a-z0-9-]+\.[a-z]{2,}$" message-when-pattern-mismatch="Please enter a valid email" required></lightning-input>
                </div>
                
           
            </div>
            <div class="slds-modal__footer">
                <lightning-button label="Cancel" title="Cancel" variant="Neutral" onclick={hideModalBox} class="slds-var-m-left_x-small"></lightning-button>
                <lightning-button label="Send" title="Send" variant="brand" onclick={handleClickDownload} class="slds-var-m-left_x-small"></lightning-button>
            </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    
 
</template>
