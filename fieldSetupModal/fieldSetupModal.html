<template>
    <!-- <lightning-button label="Field Setup" onclick={handleOpenModal} class="slds-m-around_medium"></lightning-button> -->
    <div if:true={showMessage}>
        <div class="slds-notify_container notifyContainerClass">
            <div class={themeStyle}>
                <button class="slds-button slds-notify__close slds-button--icon-inverse" title="Close" onclick={handleNotifyClose}>
                    <lightning-icon icon-name="utility:close" variant="inverse" size="small"></lightning-icon>
                </button>
                <div class="slds-grid">
                    <lightning-icon icon-name={iconName} size="small" variant="inverse" class="slds-m-right--small slds-col slds-no-flex"></lightning-icon>
                    <div class="slds-col slds-align-middle">
                        <p>{message}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- <template if:true={isModalOpen}> -->
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Field Setup</h2>
                </header>

                <!-- Modal/Popup Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-progress-indicator current-step={currentStep} type="path">
                        <lightning-progress-step label="Select Action" value="1"></lightning-progress-step>
                        <lightning-progress-step label="Select Object" value="2"></lightning-progress-step>
                        <lightning-progress-step label="Define Field" value="3"></lightning-progress-step>
                    </lightning-progress-indicator>

                    <!-- Step 1: Choose Action -->
                    <template if:true={isStep1}>
                        <div class="slds-p-top_medium">
                            <lightning-radio-group
                                    label="Choose an Action"
                                    options={step1Options}
                                    value={selectedAction}
                                    onchange={handleActionChange}>
                            </lightning-radio-group>
                        </div>
                    </template>

                    <!-- Step 2: Select Salesforce Object -->
                    <template if:true={isStep2}>
                        <div class="slds-p-top_medium">
                            <lightning-combobox 
                                    label="Select Salesforce Object" 
                                    options={objectOptions} 
                                    value={selectedObject}
                                    placeholder="Select an object"
                                    onchange={handleObjectChange}>
                            </lightning-combobox>
                        </div>
                    </template>

                    <!-- Step 3: Define Field -->
                    <!-- <template if:true={isStep3}>
                        <div class="slds-p-top_medium">
                            <lightning-input 
                                label="Field Label" 
                                value={fieldLabel} 
                                onchange={handleFieldLabelChange} 
                                required>
                            </lightning-input>
                            <lightning-combobox
                                label="Select QuickBooks Entity"
                                options={qbEntities}
                                value={selectedQBEntity}
                                placeholder="Select a QuickBooks entity"
                                onchange={handleQBEntityChange}>
                            </lightning-combobox>
                        </div>
                    </template> -->
                    <template if:true={isStep3}>
                        <div class="slds-grid slds-wrap slds-p-top_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <!-- <lightning-input 
                                    label="Field Label" 
                                    value={fieldLabel} 
                                    onchange={handleFieldLabelChange} 
                                    required>
                                </lightning-input> -->
                                <lightning-input
                                    label="Field Label"
                                    value={fieldLabel}
                                    onchange={handleFieldLabelChange}
                                    maxlength="255"
                                    required
                                    message-when-value-missing="Field Label is required">
                                </lightning-input>
                
                            
                            </div>
                            <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                                <lightning-input
                                    label="Field API Name"
                                    value={fieldApiName}
                                    onchange={handleApiNameChange}
                                    required
                                    pattern="[A-Za-z][A-Za-z0-9_]*"
                                    message-when-pattern-mismatch="API Name must be alphanumeric and start with a letter."
                                    maxlength="80"
                                    message-when-value-missing="Field API Name is required">
                                </lightning-input>
                            </div>
                            <!-- <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                                <lightning-input 
                                    label="Field Type"
                                    value="Picklist"
                                    required>
                                </lightning-input>
                            </div> -->
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-combobox
                                    label="Select QuickBooks Entity"
                                    options={qbEntities}
                                    value={selectedQBEntity}
                                    placeholder="Select a QuickBooks entity"
                                    onchange={handleQBEntityChange}>
                                </lightning-combobox>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Modal/Popup Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                    <template if:true={isStep1}>
                        <lightning-button variant="brand" label="Next" onclick={handleNext}></lightning-button>
                    </template>
                    <template if:true={isStep2}>
                        <lightning-button label="Back" onclick={handleBack}></lightning-button>
                        <lightning-button variant="brand" label="Next" onclick={handleNext}></lightning-button>
                    </template>
                    <template if:true={isStep3}>
                        <lightning-button label="Back" onclick={handleBack}></lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    <!-- </template> -->
</template>
