<!-- sldsValidatorIgnore -->
<template >

     <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open"> 
         <div class="slds-modal__container">
           <div class="slds-modal__content slds-var-p-around_x-large success-div main-div" style="border-radius: 15px !important ;  box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px !important; position:relative;overflow:visible">
                 <div class="slds-align_absolute-center">
                      <lightning-icon icon-name={iconProperty.name}  class={iconProperty.iconClass}  size="large" ></lightning-icon>
                 </div>
                 <div class="slds-text-align_center slds-text-color_success slds-text-heading_medium text"  style="font-size:2rem;font-weight:600">{welcomeCongratsMessage}</div>
                 <div class="slds-text-align_center slds-text-heading_small slds-text-color_success slds-var-p-around_large text" style="font-weight:600">{welcomeMessage}</div>
                 <div class="slds-text-align_center">
                     <button class="slds-button success-style slds-p-left_small slds-p-right_small" style="color:white" onclick={handleClick}>
                          {welcomeClickProceed}
                     </button>
                 </div>
           </div>
          </div>
       </section>
       <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
  </template>
