<template>
  <div style="height:0px">
    <c-qb_-custom-toast-comp>
    </c-qb_-custom-toast-comp>
  </div>
    <article class="slds-card" style="border: none;
            padding: 0.25rem;
            background-color: rgba(241,241,241,.5);box-shadow: 0px 2px 2px #6666;">
            <div class="slds-card__header slds-grid">
              <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                  <span class="slds-icon_container slds-icon-standard-account" title="Setup">
                  <lightning-icon icon-name="custom:custom71" size="medium"></lightning-icon>
                  </span>
                </div>
                <div class="slds-media__body">
                  <h2 class="slds-card__header-title" style="font-weight: 500;">
                    {message}
                  </h2>
                </div>
              </header>
            </div>
        </article>
        <h1 class="slds-text-heading_medium slds-theme_shade slds-align_absolute-center" style="padding: .5rem;    margin-top: 1rem;
          margin-bottom: 1rem">Submit a Ticket</h1>
        <div class="slds-align_absolute-center slds-m-around_medium">
        <div style="width: 50%;">
          <lightning-card>
              <div class="slds-m-around_medium">
                  <form class="slds-form">
                      <!-- <lightning-input type="text" label="Contact Name" data-name="contactName" required></lightning-input>
                      <lightning-input type="email" label="CC Email" data-name="email"></lightning-input> -->
                      <lightning-textarea label="Enter your query here" data-name="description" required></lightning-textarea>
                      <lightning-button variant="brand" label="Submit" title="Submit" onclick={handleSubmit} class="slds-align_absolute-center" style="margin-top: .5rem !important;"></lightning-button>
                  </form>
              </div>
          </lightning-card>
          </div>
      </div>
</template>
