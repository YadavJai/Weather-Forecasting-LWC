<template>
    <!-- modal start -->      
    <template if:true={showWarningModal}>
       <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
           <div class="slds-modal__container" style="width: 40% !important; z-index:5;">
               <!-- modal header start -->
               <header class="slds-modal__header" style="background: #014486;">
                   <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleNoEvent}>
                       <lightning-icon icon-name="utility:close"
                           alternative-text="close"
                           variant="inverse"
                           size="small" >
                       </lightning-icon>
                       <span class="slds-assistive-text">Close</span>
                   </button>
                   <h2 id="modal-heading-01" class="slds-text-heading_small slds-hyphenate" style="letter-spacing: 1px;color:white"><b>WARNING</b></h2>
               </header>

               <div class="body" id="modal-content-id-1">           
                       <p>{message}</p> 
                       <div class="display">
                           <button onclick={handleYesEvent}>Yes</button>
                           <button  onclick={handleNoEvent}>No</button>
                       </div>
               </div>

               <footer class="slds-modal__footer">
                   <!-- <lightning-input type="checkbox" label="Don't Show Again" ></lightning-input> -->
               </footer>
           </div>
       </section>
   <div class="slds-backdrop slds-backdrop_open"></div>
   </template>
</template>
