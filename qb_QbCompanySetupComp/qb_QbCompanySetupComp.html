<template>
    
    <div if:true={showMessage}>
        <div class="slds-notify_container notifyContainerClass">
            <div class={themeStyle}>
                <button class="slds-button slds-notify__close slds-button--icon-inverse" title="Close" onclick={handleNotifyClose}>
                    <lightning-icon icon-name="utility:close" variant="inverse" size="small"></lightning-icon>
                </button>
                <div class="slds-grid">
                    <lightning-icon icon-name={iconName} size="small" variant="inverse" class="slds-m-right--small slds-col slds-no-flex"></lightning-icon>
                    <div class="slds-col slds-align-middle">
                        <p>{message}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    
    
    <div class="slds-p-around_small">
        <div class="slds-box">
            <div if:true={isSpinner} class="slds-align_absolute-center">
                <img src={hicGIF} style="width: 26%;margin-top: 10%;" >       
            </div>
            <div if:false={isSpinner}>
                <table class="slds-table slds-table_bordered slds-table_cell-buffer" style="border-top: none !important; "> 
                    <thead>
                        <tr class="">
                            <!-- <th scope="col" class="slds-size_1-of-5">
                                <div class="slds-truncate"></div>
                            </th> -->
                        </tr>
                    </thead>   
                    <tbody>
                        <!-- Company Id -->
                        <tr>
                            <td>
                                <h3 class="">Selected Company Id:</h3>
                            </td>
                            <td>
                                <lightning-layout>
                                    <lightning-layout-item size="6" class="slds-input">
                                        {companyId}
                                </lightning-layout-item>
                            </lightning-layout>
                            </td>
                        </tr>
                        <!-- Pricebook Id -->
                        <tr>
                            <td>
                                <h3>Select a Pricebook:</h3>
                            </td>
                            <td style="position: relative;">
                                <lightning-layout multiple-rows style="display: flex; align-items:center;justify-content:flex-start"> 
                                    <lightning-layout-item size="6" class="">
                                        <lightning-combobox
                                            data-name="priceBookName"
                                            name="priceBook"
                                            value={pricebookSelectedValue}
                                            options={priceBookList}
                                            onchange={handleChange}
                                            class="inputs">
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="1">
                                        <div style="position: relative;">
                                        <lightning-icon 
                                        icon-name="utility:info_alt" 
                                        alternative-text="info"
                                        class="info-icon"
                                        onmouseover={handleHover}
                                        onmouseout={handleHoverOut}
                                        size="x-small"
                                        style="margin-left: .45rem;cursor:pointer;"
                                        ></lightning-icon>
                                        <div class="myModal" role="tooltip" data-id="help">
                                            <h3>This pricebook will be utilised while syncing data from Quickbooks Online To Salesforce.</h3>
                                        </div>
                                        </div>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </td>
                        </tr>
                        <!-- Currency -->
                        <!-- <tr>
                            <td>
                                <h3 class="">Currency Type:</h3>
                            </td>
                            <td>
                                <lightning-layout multiple-rows >
                                    <lightning-layout-item size="7" class="">
                                        <lightning-input type="text" name="currencyType" value={currencyType} disabled></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                                 
                            </td>
                        </tr> -->
                        <!-- Default Currency?-->
                        <tr>
                            <td>
                                <h3 class="">Default Currency Matched in QB and SF?</h3>
                            </td>
                            <td>
                                
                                
                                <template lwc:if={isQbAccessTokenExpired} >
                                    <lightning-layout multiple-rows >
                                        <lightning-layout-item size="3" class="">
                                            <lightning-icon icon-name="utility:warning" alternative-text="Warning!" title="Warning" size="x-small"></lightning-icon>
                                             Unable to fetch Status.Please Re-Connect Qb Company
                                        </lightning-layout-item>
                                       
                                    </lightning-layout>
                                </template>
                                <template lwc:elseif={isCurrencyMatching} >
                                    <lightning-layout multiple-rows >
                                        <lightning-layout-item size="2" class="" >
                                            <div class="input-with-icon">
                                                <lightning-input
                                                    name="defaultCurrency"
                                                    value={sfDefaultCurrency}
                                                    class="inputs "
                                                    variant="label-hidden"
                                                    disabled
                                                    style="width: 3.7rem;min-width:3.7rem"
                                                >
                                                </lightning-input>
                                                <lightning-icon icon-name="action:approval" style="margin-left:5px" alternative-text="Approved" title="Approved" size="x-small"></lightning-icon>
                                            </div>
                                            
                                        </lightning-layout-item>
                                        
                                    </lightning-layout>
                                </template>
                                <template lwc:else>
                                    <lightning-layout multiple-rows >
                                        <lightning-layout-item size="3" class="">
                                            <lightning-icon icon-name="utility:warning" alternative-text="Warning!" title="Warning" size="x-small"></lightning-icon>
                                            Currency did not matched.
                                        </lightning-layout-item>
                                       
                                    </lightning-layout>
                                </template>
                                
                                 
                            </td>
                            
                        </tr>
                        <!-- Using Multi-Currency? -->
                        <tr>
                            <td>
                                <h3 class="">Using Multi-Currency in SF OR QB?</h3>
                            </td>
                            <td>
                                <lightning-layout multiple-rows >
                                    <lightning-layout-item size="6" class="">
                                        <a href="https://qbsyncmadeasy.com/blog/set-up-multicurrency-in-qb-sync-made-easy/" target="_blank">
                                            Instruction Manual Link
                                        </a> 
                                    </lightning-layout-item>
                                </lightning-layout>
                                 
                            </td>
                        </tr>
                        <!-- Qb Custom fields -->
                        <tr>
                            <td>
                                <h3 class="">Didn't find Custom fields of QB in mapping?</h3>
                            </td>
                            <td>
                                <lightning-layout multiple-rows >
                                    <lightning-layout-item size="6" class="">
                                        
                                        <lightning-button 
                                            data-name="loadCustomField"
                                            variant="brand-outline"  
                                            label="Re-Sync Qb Custom fields"  
                                            onclick={handleClick} 
                                            class="slds-button_outline-brand"
                                        >
                                        </lightning-button>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </td>
                        </tr>
                        <!-- Create Picklist with Qb values -->
                        <!-- <tr>
                            <td>
                                <h3 class="">Want to Load QB values in a picklist field?</h3>
                            </td>
                            <td>
                                <lightning-layout multiple-rows >
                                    <lightning-layout-item size="6" class="">
                                        
                                        <lightning-button 
                                            data-name="loadFieldSetupModal"
                                            variant="brand-outline"  
                                            label="Create Picklist Field with QB values"  
                                            onclick={handleClick} 
                                            class="slds-button_outline-brand"
                                        >
                                        </lightning-button>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </td>
                        </tr> -->
                        <tr>
                            <td>
                                <h3 class="">Bypass duplicate alerts and save records?</h3>
                            </td>
                            <td>
                                <lightning-layout multiple-rows >
                                    <lightning-layout-item size="6" class="">
                                        <lightning-input 
                                            data-name="byepassDuplicateRule"
                                            type="checkbox" 
                                            label="Warning: Unchecking may lead to missing records" 
                                            onchange={handleClick}
                                            checked={isByepassCheckboxChecked}
                                        >
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </td>
                        </tr> 
                        <!-- Email Id -->
                        <tr>
                            <td>
                                <h3 class="">Please add email for notifications:</h3>
                            </td>
                            <td>
                                <lightning-layout-item size="6" >
                                    <lightning-input data-name="emailName"     
                                    type="email"
                                    placeholder="Get notified once the historical sync finishes (OPTIONAL)."
                                    value={emailForBatchStatus}
                                    onchange={handleChange}
                                    class="validate emailstyle inputs" style="width: 50%;">
                                    </lightning-input>  
                                </lightning-layout-item>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <h3>Configure Schedule sync</h3>
                            </td>
                            <td>
                                <lightning-button variant="brand-outline"  label="Configure Schedule sync" onclick={handleProjectSync} > </lightning-button>
                            </td>    
                        </tr>
                        <tr>
                            <td>
                                <h3>Want to Sync QuickBooks Projects? Configure Now!</h3>
                            </td>
                            <td>
                                <lightning-button variant="brand-outline"  label="Configure Now" onclick={handleProjectSfToQbSyncModal} > </lightning-button>
                            </td>    
                        </tr>
                        <!--conditional rendering for qb object sync-->
                        <template if:true={showProjectSyncModal} >
                            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-backdrop slds-backdrop_open">
                              <div class="slds-modal__container">
                                  <!-- Modal/Popup Header -->
                                  <header class="slds-modal__header">
                                      <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                              title="Close" onclick={handleCloseModal} data-modaltype = 'qbtosf'>
                                          <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                                          <span class="slds-assistive-text">Close</span>
                                      </button>
                                      <h2 class="slds-text-heading_medium">Schedule Sync</h2>
                                  </header>
                  
                                  <!-- Modal/Popup Body -->
                                  <div class="slds-modal__content slds-p-around_medium">
                                    <div style="display: flex;align-items:center;" class="">
                                        <h2 class="slds-text-heading_small">Run for every</h2>
                                        <lightning-input type="number" style="margin: 0 .5rem" step="1" value={numberOfHours} onchange={numberOfHoursMethod}></lightning-input>
                                        <h2 class="slds-text-heading_small">Hour(s)</h2>
                                        <!-- <lightning-helptext style = 'margin-left:.5rem' content="This hours will be applied to all companies"></lightning-helptext> -->
                                    </div>
                                    <lightning-dual-listbox name="Qb Objects"
                                    label="Select QB Objects to sync"
                                    source-label="Available QB Objects"
                                    selected-label="Selected QB Objects"
                                    options={qbObjectOptions}
                                    value={_selected}
                                    onchange={handleQbObjectChange}
                                    class="slds-m-top_medium">
                                    </lightning-dual-listbox>
                                    
                                  </div>
                                  <footer class="slds-modal__footer">
                                    <lightning-button label="Save Changes" variant="Success" onclick={saveSyncChanges} disabled={saveButtonDisabled}>
                                    </lightning-button>
                                </footer>
                              </div>
                          </section>
                        </template>
                        <!-- code for project from sf to qb sync modal -->
                        <template if:true={isProjectSyncModalActive}>
                            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-backdrop slds-backdrop_open">
                                <div class="slds-modal__container">
                                    <!-- Modal/Popup Header -->
                                    <header class="slds-modal__header">
                                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                                title="Close" onclick={handleCloseModal} data-modaltype = 'sftoqb'>
                                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                                            <span class="slds-assistive-text">Close</span>
                                        </button>
                                        <h2 class="slds-text-heading_medium">Configuration for Project Sync From SF To QB</h2>
                                    </header>
                    
                                    <!-- Modal/Popup Body -->
                                    <div class="slds-modal__content slds-p-around_medium">
                                        <lightning-progress-indicator current-step={currentSteps} type="base"  variant="base">
                                            <lightning-progress-step label="Introduction" value="1" onclick={handleStepChange}>
                                            </lightning-progress-step>
                                            <lightning-progress-step label="Get Credentials" value="2" onclick={handleStepChange}>
                                               
                                            </lightning-progress-step>
                                            <lightning-progress-step label="Success Page" value="3" onclick={handleStepChange}>
                                                
                                            </lightning-progress-step>
                                        </lightning-progress-indicator>
                                        <template lwc:if={step1Active}>
                                            <div class="slds-p-around_small">
                                                <div style="display: flex;align-items:center;justify-content:center">
                                                    <div style="display: flex; align-items:center; flex-direction:column; gap:1rem; width:70%">
                                                        <h1 class="slds-text-heading_large">
                                                            Do you want to sync QuickBooks projects from Salesforce?
                                                        </h1>
                                                        <!-- <p style="font-size: 1rem;">
                                                            This tool allows you to seamlessly sync projects between Salesforce (SF) and QuickBooks (QB).
                                                            By configuring the settings here, you can ensure that your project data is always up-to-date and 
                                                            consistent across both platforms.
                                                            You can learn how to setup everything <a href="www.google.com" target="_blank"> here </a> before moving towards the next step.
                                                        </p> -->
                                                        <p style="font-size: 1rem;">
                                                            QB Sync Made Easy enables you to sync QuickBooks projects directly from Salesforce, ensuring your data stays accurate and up-to-date across both platforms. 
                                                            Configure your settings here for a seamless integration.
                                                            Before moving to the next step, follow our <a href="https://support.qbsyncmadeasy.com/popular-articles/a-step-by-step-guide-to-set-up-quickbooks-project-synchronization-in-salesforce/" target="_blank">setup guide </a>to get everything in place.
                                                        </p>
                                                    </div>
                                                    <img src={girlGif} width="25%">
                                                </div>
                                            </div>
                                        </template>
                                        <template lwc:elseif={step2Active}>
                                            <div class="slds-p-around_small">
                                                <template if:false={showEditProjectCredModal}>
                                                    <div>
                                                        <h1 class="slds-m-bottom_medium slds-text-heading_large">
                                                            Enter Credentials Details
                                                        </h1>
                                                        <div>
                                                            <lightning-input type="gmail" label="Enter your QB Username" required onchange={handleProjectModalInput} data-inputtype="username"
                                                            value = {userNameInputVal}>
    
                                                            </lightning-input>
                                                            <lightning-input type="password" label="Enter your Password" class="slds-m-top_medium slds-m-bottom_medium" required 
                                                            data-inputtype="password"
                                                            onchange={handleProjectModalInput}
                                                            value={passwordInputVal}
                                                            >
    
                                                            </lightning-input>
                                                            <lightning-combobox
                                                                name='verificationtype'
                                                                label='Select Verification Type'
                                                                options={verificationOptions}
                                                                value={selectedVerificationOption}
                                                                disabled="true"
                                                            >
                                                            </lightning-combobox>
                                                            <lightning-input type="text" label="Enter Security Code" class="slds-m-top_medium" required onchange={handleProjectModalInput}
                                                            data-inputtype="authinput"
                                                            value={authInputVal}>
    
                                                            </lightning-input>
                                                        </div>
                                                    </div>
                                                </template>
                                                <template if:true={showEditProjectCredModal}>
                                                    <h1 class="slds-text-heading_large slds-m-right_small">
                                                        You have already saved the credentials. If you want to edit them, please click the edit button below.                                                    </h1>
                                                    <lightning-button label="Edit the Credentials" onclick={handleEditCred} class="slds-align_absolute-center" variant="brand">
                                                    </lightning-button>
                                                </template>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div class="slds-p-around_small">
                                                <div class="slds-align_absolute-center" style="display: flex; align-items:center;flex-direction:column;">
                                                    <h1 class="slds-text-heading_large slds-m-right_small">
                                                        Congratulations!
                                                    </h1>
                                                    <img src={doneGIF} style="width: 25%;" >  
                                                </div>
                                                <p style="font-size: 1rem;" class="slds-align_absolute-center">
                                                    You have successfully setup everything.
                                                </p>
                                            </div>
                                        </template>
                                    </div>
                                    <footer class="slds-modal__footer">
                                        <template if:true={stepMoreThan1}>
                                            <lightning-button label="Previous" variant="brand-outline"
                                            data-buttontype="prev" onclick={handlePrevOrNextButton}>
                                        </lightning-button>
                                        </template>
                                        <template if:false={isLastStep}>
                                            <lightning-button label="Next" variant="Brand" data-buttontype = "next"
                                             class="slds-m-left_medium"
                                            onclick={handlePrevOrNextButton}>
                                            </lightning-button>
                                        </template>
                                  </footer>
                                </div>
                            </section>
                        </template>
                    </tbody>
                </table>
            </div>
            
        </div>
    </div>
    
    <!-- spinner -->
    <template if:true={showLoadingSpinner}>
        <lightning-spinner 
        alternative-text="Loading" 
        size="small"
        variant="brand" 
        class="custom-spinner"
        ></lightning-spinner>
    </template>



    <div if:false={isSpinner} class="buttonDivSection slds-align_absolute-center">
        <lightning-button  
            icon-name="utility:back" 
            variant="success" 
            name="Go To Previous Step" 
            label="Go To Previous Step" 
            title="Go To Previous Step"
            onclick={handleClick} 
            data-name="previousBtn" 
            class="slds-var-m-left_x-small"
        >
        </lightning-button>
        <lightning-button  
            icon-name="utility:forward" 
            icon-position="right" 
            variant="success" 
            name="Save And Go To Next Page" 
            label="Save And Go To Next Page" 
            title="Save And Go To Next Page"
            onclick={handleClick} 
            data-name="saveAndNextBtn" 
            class="slds-var-m-left_x-small"
        >
        </lightning-button>
    </div>

     <!-- Custom Toast -->
     <c-qb_-custom-toast-comp></c-qb_-custom-toast-comp>
    
    <!-- <template if:true={openFieldSetupComp}>
        <c-field-setup-modal onclosefieldsetupmodal={handleFieldSetupModalClose} company-id={companyId}></c-field-setup-modal>
    </template> -->
</template>
