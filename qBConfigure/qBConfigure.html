<template>


  <!--code for custom toast comp-->
  <div style="height:0px">
    <c-qb_-custom-toast-comp>
    </c-qb_-custom-toast-comp>
  </div>
   <!-- <div class="main-class">  -->
      <!---code for the side bar-->
  <lightning-layout style="min-height: 100vh;">
      <lightning-layout-item size="2" multiple-rows class="slds-grid_vertical-stretch" style=" background-color:rgba(241,241,241,.5);">
        <div class="sidebar-class slds-accordion sticky-element">
          <div style="display: flex;justify-content:space-between;align-items:center"
          class="slds-m-bottom_medium slds-m-left_medium slds-m-top_small slds-p-right_small">
            <div style="display: flex;">
              <lightning-icon icon-name="standard:apps" size="medium" class="slds-m-right_small">
              </lightning-icon>
              <h1 style="font-size: 1rem;
              color: rgba(3, 45, 96, 1);
              font-weight: 600;display:flex;align-items:center">
                MENU
              </h1>
            </div>
            <lightning-icon icon-name="utility:chevronleft" size="small" style="cursor: pointer;"
            onclick={deactiveMenu} title="Click here to close the Menu">
            </lightning-icon>
          </div>
          <div style="width: 100%;font-size:1rem">
            <lightning-vertical-navigation>
              <lightning-vertical-navigation-section variant="label-hidden">
                <p style="font-weight:600;margin-left:1.5rem">SETUP & CONFIG</p>
                <lightning-vertical-navigation-item label="Setup" name="Setup" onclick={handleVerticalTabClick}
                class="setup">
                </lightning-vertical-navigation-item>
                <lightning-accordion allow-multiple-sections-open>
                  <lightning-accordion-section name="A" label="Configuration" style="padding:0 !important;">
                    <ul>
                      <!-- <li>
                        <lightning-vertical-navigation-item label="Default Value Settings" name="Default Value Settings"
                        onclick={handleVerticalTabClick}>
                        </lightning-vertical-navigation-item>
                      </li> -->
                      <li>
                        <lightning-vertical-navigation-item label="Real-Time Sync Settings" name="Real-Time Sync Settings"
                        onclick={handleVerticalTabClick}>
                        </lightning-vertical-navigation-item>
                      </li>
                    </ul>
                  </lightning-accordion-section>
                </lightning-accordion>
                <!-- <lightning-vertical-navigation-item label="Delete/Inactive Setting"
                name="Delete/Inactive Setting" onclick={handleVerticalTabClick}>
                </lightning-vertical-navigation-item> -->
                <lightning-vertical-navigation-item label="Permissions" name="Permissions"
                onclick={handleVerticalTabClick}>
                </lightning-vertical-navigation-item>
              </lightning-vertical-navigation-section>
              <lightning-vertical-navigation-section>
                <p style="font-weight:600;margin-left:1.5rem">TOOLS</p>
                <lightning-vertical-navigation-item label="Enable Debugging" name="Enable Debugging"
                onclick={handleVerticalTabClick}>
                </lightning-vertical-navigation-item>
              </lightning-vertical-navigation-section>
              <lightning-vertical-navigation-section>
                <p style="font-weight:600;margin-left:1.5rem">HELP</p>
                <lightning-vertical-navigation-item label="Support Website" name="Support Website"
                href="https://support.qbsyncmadeasy.com/">
                </lightning-vertical-navigation-item>
                <!-- <lightning-vertical-navigation-item label="Raise a Ticket" 
                name="Raise a Ticket" target="_blank" onclick={handleVerticalTabClick}>
                </lightning-vertical-navigation-item> -->
                <lightning-vertical-navigation-item label="Learn More" name="Learn More"
                href="https://qbsyncmadeasy.com/">
                </lightning-vertical-navigation-item>
                <lightning-vertical-navigation-item label="Agent" name="Agent"
                onclick={handleVerticalTabClick}>
                </lightning-vertical-navigation-item>
              </lightning-vertical-navigation-section>
            </lightning-vertical-navigation>
          </div>
        </div>
    </lightning-layout-item>
      <!-- sidebar ended -->
      <!-- code for right menu icon -->
      <lightning-icon icon-name="utility:chevronright" size="small" style="z-index: 20;
      position: fixed;
      background-color: rgb(233, 246, 246);
      left: -10px;
      top: 50%;
      opacity: 1;
      border:1px solid #6666;
      display:none;
      cursor:pointer;
      border-radius: 10px;" onclick={activeMenu} title="Click here to see the Menu"
      class="slds-p-around_x-small activeMenuIcon">
      </lightning-icon>
      <lightning-layout-item size="10" class="setupComp">
      <!-- for setup -->
      <template if:true={setupActive}>
        <c-qb-setup-page >

        </c-qb-setup-page>
      </template>
      <!-- for configuration items -->
      <template if:true={defaultSettingActive}>
        <c-qb_-default-setting-comp>
        </c-qb_-default-setting-comp>
      </template>
      <!--for permission page-->
      <template if:true={permissionActive}>
        <c-qb_-permission-comp>
        </c-qb_-permission-comp>
      </template>
      <!-- for debugging -->
      <template if:true={debuggingActive}>
        <c-qb_-debugging-comp >
        </c-qb_-debugging-comp>
      </template>
      <template if:true={realTimeSyncActive}>
        <c-qb_-real-time-setting-comp >
        </c-qb_-real-time-setting-comp>
      </template>
      <template if:true={chatAgentActive}>
        <c-salesforce-agent-lwc >
        </c-salesforce-agent-lwc>
      </template>
      <!-- <template if:true={deleteSettingActive}>
      <c-qb_-delete-inactive-setting-comp style="min-width: 80vw;">
      </c-qb_-delete-inactive-setting-comp>
      </template> -->
      <!-- for contact support -->
      <!-- <template if:true={contactSupportActive}>
        <c-qb_-contact-support-comp message="Contact Support"
        onsubmitevent={onCustomerSupportSubmit}>
        </c-qb_-contact-support-comp>
      </template> -->
    </lightning-layout-item>
  </lightning-layout>
  <!-- </div> -->

  </template>
