<template>
    <div if:false={isLoaded} class="slds-align_absolute-center">
      <lightning-spinner variant="brand" size="small" alternative-text="Loading">
      </lightning-spinner>
    </div>
    <article class="slds-card" style="border: none; padding: 0.25rem;background-color: rgba(241,241,241,.5); box-shadow: 0px 2px 2px #6666;">
      <div class="slds-card__header slds-grid">
        <header class="slds-media slds-media_center slds-has-flexi-truncate">
          <div class="slds-media__figure">
            <span class="slds-icon_container slds-icon-standard-account" title="Debugging">
              <lightning-icon icon-name="custom:custom67" size="medium">
              </lightning-icon>
            </span>
          </div>
          <div class="slds-media__body">
            <h2 class="slds-card__header-title" style="font-weight: 500;">
              Debugging
            </h2>
          </div>
        </header>
      </div>
    </article>
    <div class="main-class">
      <div style="height:0px">
        <c-qb_-custom-toast-comp>
        </c-qb_-custom-toast-comp>
      </div>
      <div class="debug-class">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <p style="font-size: 1rem; font-weight: 500;">
            Got stuck somewhere? Enable debugging!
          </p>
          <div class="slds-form-element">
            <label class="slds-checkbox_toggle slds-grid">
              <input type="checkbox" name="checkbox-toggle-37" data-name="logCheckBox" checked={isChecked} onchange={handleToggle}/>
              <span id="checkbox-toggle-37" class="slds-checkbox_faux_container">
                <span class="slds-checkbox_faux">
                </span>
              </span>
            </label>
          </div>
        </div>
        <div class="debug_expire_class" style="display: flex; justify-content: space-between; align-items: center;">
          <p style="font-size: 1rem; font-weight: 500;">
            Enter number of days to store Logs
          </p>
          <div>
            <!-- <template if:true={isChecked}> -->
              <lightning-input type="number" data-name="dateInput" max="30" min="1" required="true" label="Range 1-30 Days" style="width: 10rem;">
              </lightning-input>
            <!-- </template>
            <template if:false={isChecked}>
              <lightning-input data-name="dateInput" label="Debugging is Deactivated" style="width: 10rem;">
              </lightning-input>
            </template> -->
          </div>
        </div>
        <lightning-button variant="brand" label="Save Changes" title="Save Changes" onclick={saveChanges} class="slds-align_absolute-center">
        </lightning-button>
      </div>
      <a onclick={navigateToLogs} style="text-decoration: underline;"> Click here to view all the Logs.</a>
    </div>
  </template>
